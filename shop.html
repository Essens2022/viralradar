<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8faf8"><meta name="description" content="Explore our selected products."><title>Selected Shop</title><style>*{box-sizing:border-box}body{margin:0;background:#f8faf8;color:#162c2a;font:16px system-ui}header{height:70px;background:white;border-bottom:1px solid #e4ebe6;display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100vw - 1080px)/2))}header b{font-size:22px;letter-spacing:-.8px}button,select{background:#173c34;color:white;border:0;border-radius:11px;padding:11px 15px;font:inherit}select{background:#edf3ef;color:#173c34}main{max-width:1080px;margin:auto;padding:48px 20px}.eyebrow{font-size:12px;letter-spacing:.16em;color:#5a766b;font-weight:700}h1{font-size:clamp(32px,6vw,60px);line-height:1.07;letter-spacing:-2px;max-width:750px;margin:15px 0}p{color:#5e726b;line-height:1.7}.panel{background:white;border:1px solid #e0eae4;border-radius:22px;padding:28px;margin-top:36px}.empty{padding:38px 10px;text-align:center}.empty .icon{font-size:44px}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}.product{background:white;border:1px solid #e0eae4;border-radius:18px;overflow:hidden}.product img{width:100%;aspect-ratio:1.1;object-fit:cover}.product section{padding:20px}.product strong{display:block;font-size:20px}.price{font-size:23px;font-weight:800;margin:12px 0}footer{border-top:1px solid #e0eae4;margin-top:60px;padding:30px 20px;color:#6b7d76;text-align:center;font-size:13px}@media(max-width:600px){main{padding-top:35px}.panel{padding:18px}}</style></head><body><header><b id="brand">Selected Shop</b><select id="lang" aria-label="Language"></select></header><main><span class="eyebrow" id="eyebrow"></span><h1 id="headline"></h1><p id="intro"></p><div class="panel" id="content"></div></main><footer id="footer"></footer><script>
const dict={en:['CURATED SELECTION','Products selected with care.','Browse our collection and find what suits you.','Our collection is coming soon.','Products will appear here after review.','Contact us to order','Shipping and returns information will be provided before purchase.'],it:['SELEZIONE CURATA','Prodotti selezionati con cura.','Esplora la nostra collezione.','La collezione sarà disponibile a breve.','I prodotti appariranno qui dopo la verifica.','Contattaci per ordinare','Le informazioni su spedizione e resi saranno fornite prima dell’acquisto.'],fr:['SÉLECTION SOIGNÉE','Des produits choisis avec soin.','Découvrez notre collection.','Notre collection arrive bientôt.','Les produits apparaîtront ici après vérification.','Contactez-nous pour commander','Les informations de livraison et de retour seront fournies avant achat.'],de:['SORGFÄLTIGE AUSWAHL','Mit Sorgfalt ausgewählte Produkte.','Entdecken Sie unsere Kollektion.','Unsere Kollektion kommt bald.','Produkte erscheinen hier nach Prüfung.','Kontaktieren Sie uns zur Bestellung','Versand- und Rückgabeinformationen werden vor dem Kauf bereitgestellt.'],es:['SELECCIÓN ESPECIAL','Productos seleccionados con cuidado.','Descubre nuestra colección.','Nuestra colección estará disponible pronto.','Los productos aparecerán aquí después de su revisión.','Contáctanos para comprar','Los detalles de envío y devoluciones se facilitarán antes de comprar.'],ro:['SELECȚIE ATENTĂ','Produse alese cu grijă.','Explorează colecția noastră.','Colecția va fi disponibilă în curând.','Produsele vor apărea aici după verificare.','Contactează-ne pentru comandă','Informațiile despre livrare și retur vor fi oferite înainte de cumpărare.'],ru:['ОТБОРНЫЕ ТОВАРЫ','Товары, выбранные с заботой.','Изучите нашу коллекцию.','Коллекция скоро появится.','Товары появятся здесь после проверки.','Свяжитесь с нами для заказа','Условия доставки и возврата будут предоставлены до покупки.'],pt:['SELEÇÃO CUIDADOSA','Produtos escolhidos com cuidado.','Explore a nossa coleção.','A coleção estará disponível em breve.','Os produtos aparecerão aqui após análise.','Contacte-nos para encomendar','As informações de entrega e devolução serão fornecidas antes da compra.'],pl:['STARANNY WYBÓR','Produkty wybrane z troską.','Poznaj naszą kolekcję.','Kolekcja już wkrótce.','Produkty pojawią się po weryfikacji.','Skontaktuj się z nami, aby zamówić','Informacje o dostawie i zwrotach zostaną podane przed zakupem.'],nl:['ZORGVULDIGE SELECTIE','Met zorg geselecteerde producten.','Ontdek onze collectie.','Onze collectie komt binnenkort.','Producten verschijnen hier na controle.','Neem contact op om te bestellen','Informatie over levering en retourneren volgt vóór aankoop.']};
let products=[];const url=new URL(location.href);let lang=url.searchParams.get('lang')||localStorage.getItem('shop-lang')||(navigator.languages||[navigator.language||'en']).map(x=>x.split('-')[0]).find(x=>dict[x])||'en';function render(){const t=dict[lang]||dict.en;document.documentElement.lang=lang;['eyebrow','headline','intro'].forEach((id,i)=>document.getElementById(id).textContent=t[i]);document.getElementById('footer').textContent=t[6];document.getElementById('lang').value=lang;document.getElementById('content').innerHTML=products.length?'<div class="products">'+products.map(p=>'<article class="product">'+(p.image?'<img src="'+safe(p.image)+'" alt="">':'')+'<section><strong>'+safe(p.name?.[lang]||p.name?.en||'')+'</strong><p>'+safe(p.description?.[lang]||p.description?.en||'')+'</p><div class="price">'+Number(p.price).toFixed(2)+' €</div><p>'+t[5]+'</p></section></article>').join('')+'</div>':'<div class="empty"><div class="icon">◇</div><h2>'+t[3]+'</h2><p>'+t[4]+'</p></div>'}function safe(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const sel=document.getElementById('lang');sel.innerHTML=Object.keys(dict).map(x=>'<option value="'+x+'">'+({en:'English',it:'Italiano',fr:'Français',de:'Deutsch',es:'Español',ro:'Română',ru:'Русский',pt:'Português',pl:'Polski',nl:'Nederlands'}[x])+'</option>').join('');sel.onchange=()=>{lang=sel.value;localStorage.setItem('shop-lang',lang);render()};fetch('./products.json',{cache:'no-store'}).then(r=>r.ok?r.json():[]).then(data=>{products=Array.isArray(data)?data.filter(p=>p.status==='published'):[];render()}).catch(()=>render());render();
</script></body></html>

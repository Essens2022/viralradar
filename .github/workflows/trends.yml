name: Refresh live trends
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch_trends.py'
      - '.github/workflows/trends.yml'
      - 'scripts/fetch_offers.py'
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fetch_trends.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - run: python scripts/fetch_offers.py
        env:
          GOOGLE_SEARCH_API_KEY: ${{ secrets.GOOGLE_SEARCH_API_KEY }}
          GOOGLE_SEARCH_ENGINE_ID: ${{ secrets.GOOGLE_SEARCH_ENGINE_ID }}
      - name: Commit verified feed
        run: |
          git config user.name "viralradar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- trends.json offers.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh live Google Trends feed"
            git push
          fi

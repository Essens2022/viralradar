wrap:anywhere}.source-name{font-size:11px;color:#adc1c6;overflow-wrap:anywhere}.tile strong{font-size:14px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tile small{display:block;color:var(--muted);font-size:11px;margin-top:5px}.tag{display:inline-block;color:var(--lime);background:#23432f;border-radius:9px;padding:5px 8px;font-size:11px;margin-top:6px}.hero{border-radius:18px;background:linear-gradient(135deg,#133743,#071c26 70%);padding:20px;margin-bottom:17px;border:1px solid #28505a}.hero h1{font-size:25px;letter-spacing:-.8px;margin:4px 0 10px}.hero p{font-size:12px;color:#a9bdc1;line-height:1.6}.section{font-weight:800;font-size:15px;margin:20px 0 11px}.meta{font-size:11px;color:#9bb3b8;line-height:1.55}.scan{padding:18px;text-align:center;background:radial-gradient(circle at center,#214a42,#0f2833 65%);border:1px solid #3c6553;border-radius:19px;margin-bottom:13px}.orb{height:115px;width:115px;margin:0 auto 13px;border:1px solid #a8dd67;border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 22px,#426b5b99 23px 24px);position:relative;display:grid;place-items:center;font-size:34px;color:var(--lime)}.orb:after{content:'';position:absolute;inset:0;background:conic-gradient(transparent 60%,#c9fa5355 90%,transparent);border-radius:50%;animation:turn 3.4s linear infinite}@keyframes turn{to{transform:rotate(360deg)}}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.stat{padding:16px;background:#132d37;border:1px solid #274550;border-radius:15px}.stat strong{display:block;color:var(--lime);font-size:23px;margin-top:8px}.stat small{color:var(--muted);font-size:11px}.bigpic{height:215px;background:radial-gradient(circle,#365e63,#152e3a 75%);border-radius:20px;display:grid;place-items:center;font-size:70px;color:var(--lime);margin-bottom:15px;border:1px solid #3d5962}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:11px 0}.row strong{font-size:13px}.input{background:#193540;border:1px solid #34505b;border-radius:10px;color:white;padding:11px;width:125px;text-align:right}.chart{height:175px;width:100%;display:block}.empty{padding:30px 14px;text-align:center;color:#9bb3b8}.footnote{font-size:11px;color:#9cb0b5;line-height:1.6;margin:12px 0}.link{color:var(--lime);text-decoration:none}.loader{display:inline-block;height:13px;width:13px;border:2px solid #8cbb50;border-top-color:transparent;border-radius:50%;animation:turn .8s linear infinite}.split{display:grid;grid-template-columns:1fr 1fr;gap:9px}.split .btn{padding:12px 8px;font-size:12px}.badge{border:1px solid #42674b;border-radius:18px;padding:5px 9px;color:var(--lime);font-size:10px}.error{border:1px solid #965d3d;color:#ffb995;background:#38251f;padding:13px;border-radius:13px;margin:12px 0}a{color:var(--lime)}.line{height:1px;background:#2a4550;margin:15px 0}@media(min-width:700px){.top,.sub,nav{padding-left:max(20px,calc((100vw - 640px)/2));padding-right:max(20px,calc((100vw - 640px)/2))}nav button{max-width:128px}}
</style></head><body><header class="top"><div class="logo"><span class="mark">⌖</span>ViralRadar</div><button aria-label="Notificări" onclick="go('Profil')">♧</button></header><div class="sub"><button class="back" id="back" onclick="back()">‹</button><strong id="title">Acasă</strong></div><main id="main"></main><nav id="nav"></nav><script>
const tabs=['Acasă','Descoperă','Analiză','Salvate','Profil'],symbols=['⌂','⌕','▥','♡','♙'],countries=['Italia','Europa','Global','Germania','Franța','Spania','Regatul Unit','România','Polonia','SUA','Canada'],periods=['24h','7 zile','30 zile','90 zile'];let page='Acasă',stack=[],country='Italia',period='24h',category='Toate',selected=null,feed=[],updated='',loading=false,error='',saved=read('vr-watchlist',[]),costs=read('vr-costs',{}),offers=read('vr-offers-v2',[]),liveOffers={},tab='Viralitate',offerFilter='Toate',sort='Cost total';function read(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}}function persist(){localStorage.setItem('vr-watchlist',JSON.stringify(saved));localStorage.setItem('vr-costs',JSON.stringify(costs));localStorage.setItem('vr-offers-v2',JSON.stringify(offers))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function go(p){if(page!==p)stack.push(page);page=p;render()}function back(){page=stack.pop()||'Acasă';render()}function product(){return selected}function id(t){return t.geo+'|'+t.name}function isSaved(t){return saved.some(x=>id(x)===id(t))}function toggleSave(){if(!selected)return;let k=id(selected);saved=isSaved(selected)?saved.filter(x=>id(x)!==k):[selected,...saved];persist();render()}function choose(i,scope){let arr=scope==='saved'?saved:scope==='home'?feed.slice(0,5):filtered();selected=arr[i];if(selected)go('Produs')}function chips(arr,val,callback){return '<div class="chips">'+arr.map(x=>'<button class="chip '+(x===val?'on':'')+'" onclick="'+callback+'(\''+x+'\')">'+esc(x)+'</button>').join('')+'</div>'}function setCountry(x){country=x;render()}function setPeriod(x){period=x;render()}function setCategory(x){category=x;render()}function setTab(x){tab=x;render()}function setOfferFilter(x){offerFilter=x;render()}function filtered(){let a=feed.filter(x=>country==='Global'||country==='Europa'&&['Italia','Regatul Unit','Germania','Franța','Spania','Polonia','România'].includes(x.region)||x.region===country);let q=(document.getElementById('filterq')?.value||'').trim().toLowerCase();if(q)a=a.filter(x=>x.name.toLowerCase().includes(q));return a}async function scan(){loading=true;error='';render();try{let r=await fetch('https://raw.githubusercontent.com/Essens2022/viralradar/main/trends.json?v='+Date.now(),{cache:'no-store'}).catch(()=>null);if(!r||!r.ok)r=await fetch('./trends.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Fluxul radar nu este disponibil încă');let j=await r.json();if(!Array.isArray(j.items))throw Error('Format radar invalid');feed=j.items.filter(x=>x&&x.name&&x.region&&(x.source!=='Google News RSS'||(x.productStatus==='candidate_unverified'&&x.name.length<=75&&!/[:«»]/.test(x.name)&&!/\\b(miglior|guida|best|gadgets|prodotti|products|recensione|review|event|livestream|trappola)\\b/i.test(x.name))));if(selected&&!feed.some(x=>id(x)===id(selected)))selected=null;updated=j.updatedAt||'';try{let or=await fetch('https://raw.githubusercontent.com/Essens2022/viralradar/main/offers.json?v='+Date.now(),{cache:'no-store'}).catch(()=>null);if(!or||!or.ok)or=await fetch('./offers.json?v='+Date.now(),{cache:'no-store'});if(or.ok){let o=await or.json();liveOffers=o.offers||{}}}catch(e){console.warn('Ofertele automate nu sunt disponibile',e)}if(!feed.length)error='Fluxul automat nu conține încă produse identificabile. Ultima verificare a datelor: '+pdate()+'.';}catch(e){error=e.message||'Eroare la scanare'}loading=false;render()}function pdate(){return updated?new Date(updated).toLocaleString('ro-RO'):'Nedisponibil'}function productOffers(t){return liveOffers[id(t)]||[]}function bestOffer(t){return productOffers(t).filter(o=>Number.isFinite(Number(o.price))&&Number(o.price)>0).sort((a,b)=>a.price-b.price)[0]||null}function imageUrl(t){let o=productOffers(t).find(x=>typeof x.image==='string'&&/^https:\/\//i.test(x.image));return o?o.image:(t.image&&/^https:\/\//i.test(t.image)?t.image:'')}function imageMarkup(t,big){let src=imageUrl(t);return src?'<img src="'+esc(src)+'" alt="Imagine de la sursa produsului" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">':(big?'Imagine indisponibilă':'⌕')}function sourceName(t){let o=bestOffer(t);return o?o.seller:(t.source||'Sursă necunoscută')}function volume(t){return t.traffic?String(t.traffic):'Nedisponibil'}function score(t){return 'Nedisponibil'}function label(t){return esc(t.traffic||'Volum indisponibil')}function rows(arr,scope){return arr.map((t,i)=>{let offer=bestOffer(t);return '<div class="tile" onclick="choose('+i+',&quot;'+scope+'&quot;)"><span class="num">'+(i+1)+'</span><div class="pic">'+imageMarkup(t,false)+'</div><div class="body"><strong>'+esc(t.name)+'</strong><small>'+esc(t.region)+' · '+esc(sourceName(t))+'</small><small>Preț: '+(offer?fmt(offer.price):'Nedisponibil')+' · Căutări: '+esc(volume(t))+'</small><span class="tag">Scor viralitate: '+score(t)+'</span></div><span class="accent">›</span></div>'}).join('')}function evidenceView(t){let news=(t.news||[]).slice(0,4),videos=(t.videos||[]).slice(0,3);let all=[...news.map(n=>({...n,type:'Articol'})),...videos.map(v=>({...v,type:'Video'}))];return '<div class="card"><h3>Dovezi din surse publice</h3>'+(all.length?all.map(x=>'<div class="row"><div style="min-width:0"><small class="muted">'+esc(x.type)+'</small><div style="font-size:12px;overflow-wrap:anywhere">'+esc(x.title)+'</div></div><a class="link" href="'+esc(x.url)+'" target="_blank" rel="noopener noreferrer">Deschide ↗</a></div>').join(''):'<p class="muted">Nu există încă articole sau videoclipuri asociate acestui rezultat.</p>')+'</div>'}function sourceLinks(t){let q=encodeURIComponent(t.name),links=[['Google Trends','https://trends.google.com/trends/explore?q='+q],['Google Shopping','https://www.google.com/search?tbm=shop&q='+q],['Amazon','https://www.amazon.it/s?k='+q],['eBay','https://www.ebay.it/sch/i.html?_nkw='+q],['AliExpress','https://www.aliexpress.com/w/wholesale-'+q+'.html']];return '<div class="card"><h3>Surse de verificare</h3><div class="split">'+links.map(x=>'<a class="btn secondary" style="text-decoration:none;text-align:center" target="_blank" rel="noopener noreferrer" href="'+esc(x[1])+'">'+x[0]+' ↗</a>').join('')+'</div></div>'}function fmt(n){return Number(n||0).toLocaleString('ro-RO',{style:'currency',currency:'EUR'})}function chart(){return '<svg class="chart" viewBox="0 0 340 170" role="img" aria-label="Grafic indisponibil"><g stroke="#28424a" stroke-width="1">'+[20,60,100,140].map(y=>'<line x1="15" x2="330" y1="'+y+'" y2="'+y+'"/>').join('')+'</g><text x="170" y="83" fill="#adc0c2" text-anchor="middle" font-size="13">Istoric indisponibil</text><text x="170" y="103" fill="#7899a1" text-anchor="middle" font-size="10">Nu afișăm valori inventate</text></svg>'}function updateCost(k,v){if(!selected)return;let key=id(selected);costs[key]=costs[key]||{};costs[key][k]=Math.max(0,Number(v)||0);persist();calculate()}function calculate(){if(!selected)return;let c=costs[id(selected)]||{},sell=+c.sell||0,buy=+c.buy||0,shipping=+c.shipping||0,fees=+c.fees||0,ads=+c.ads||0,returns=+c.returns||0,profit=sell-buy-shipping-fees-ads-returns;let el=document.getElementById('profitval');if(el)el.textContent=fmt(profit);let margin=document.getElementById('marginval');if(margin)margin.textContent=sell?((profit/sell)*100).toFixed(1)+'%':'—'}function costInput(k,label){let c=costs[id(selected)]||{};return '<div class="row"><label for="c'+k+'">'+label+'</label><input id="c'+k+'" class="input" inputmode="decimal" type="number" min="0" step=".01" value="'+esc(c[k]||0)+'" oninput="updateCost(\''+k+'\',this.value)"></div>'}function addOffer(){if(!selected)return;let seller=document.getElementById('seller').value.trim(),url=document.getElementById('offerurl').value.trim(),price=+document.getElementById('offerprice').value,shipping=+document.getElementById('offership').value;if(!seller||!/^https:\/\//i.test(url)||!Number.isFinite(price)||price<=0||shipping<0)return alert('Completează oferta și un link HTTPS valid');offers.push({key:id(selected),seller,url,price,shipping});persist();render()}function content(){let h='';if(page==='Acasă'){h='<div class="hero"><h1>Descoperă produse cu potențial</h1><p>Radar pentru tendințe și oportunități de piață</p><button class="btn" onclick="go(\'Descoperă\');scan()">⌕ Scanează produse</button></div><div class="stats"><div class="stat"><small>Subiecte găsite</small><strong>'+feed.length+'</strong></div><div class="stat"><small>Salvate</small><strong>'+saved.length+'</strong></div></div><div class="section flex"><span>În creștere</span><a class="link" href="#" onclick="event.preventDefault();go(\'Descoperă\')">Vezi toate →</a></div>'+(feed.length?rows(feed.slice(0,5),'home')+(feed.length>5?'<button class="btn secondary" onclick="go(\'Descoperă\')">Vezi toate cele '+feed.length+' rezultate →</button>':''):'<div class="card empty">Pornește radarul pentru a descoperi tendințele disponibile</div>')+'<p class="footnote">Datele radarului provin din căutări publice și necesită verificarea relevanței comerciale</p>'}if(page==='Descoperă'){h='<div class="scan"><div class="orb">⌖</div><h2 style="margin:0 0 8px">Radar produse</h2><button class="btn" '+(loading?'disabled':'')+' onclick="scan()">'+(loading?'<span class="loader"></span> Se scanează':'⌕ Scanează acum')+'</button></div>'+chips(countries,country,'setCountry')+chips(periods,period,'setPeriod')+'<div class="flex" style="margin:5px 0 13px"><strong>Rezultate</strong><span class="badge">'+(updated?'Actualizat '+esc(pdate()):'Așteaptă scanarea')+'</span></div>'+(error?'<div class="error">'+esc(error)+'</div>':'')+(filtered().length?rows(filtered().slice(0,60),'feed'):'<div class="card empty">'+(loading?'Se încarcă rezultatele...':feed.length?'Nu există rezultate pentru '+esc(country)+'. Încearcă Global sau Europa.':'Nu există încă produse identificabile în fluxul actual.')+'</div>')+'<p class="footnote">Google Trends RSS oferă subiecte căutate, nu doar produse și nu confirmă vânzări. Filtrul de perioadă este pregătit pentru integrarea datelor istorice, însă fluxul actual nu furnizează separat 7, 30 sau 90 de zile. Europa include țările disponibile în flux, nu întreaga regiune</p>'}if(page==='Produs'){let t=product();if(!t)return '<div class="empty">Selectează un rezultat</div>';h='<div class="bigpic">'+imageMarkup(t,true)+'</div><div class="flex"><h1 class="heading">'+esc(t.name)+'</h1><button class="chip" onclick="toggleSave()">'+(isSaved(t)?'♥':'♡')+'</button></div><div class="muted">'+esc(t.region)+' · '+esc(t.source||'Google Trends')+'</div><div class="card" style="margin-top:15px"><h3>Interes raportat</h3><div class="stats"><div class="stat"><small>Căutări raportate</small><strong style="font-size:18px">'+label(t)+'</strong></div><div class="stat"><small>Scor viralitate</small><strong style="font-size:18px">N/D</strong></div></div><p class="footnote">Volumul raportat nu este număr de vânzări, iar scorul nu poate fi calculat fără date suficiente</p></div><div class="split"><button class="btn" onclick="go(\'Analiză\')">Analiză →</button><button class="btn secondary" onclick="go(\'Furnizori\')">Furnizori →</button></div>'+evidenceView(t)+sourceLinks(t)}if(page==='Analiză'){if(!selected)return '<div class="card empty">Selectează un rezultat din Descoperă pentru analiză<button class="btn" onclick="go(\'Descoperă\')">Descoperă</button></div>';h='<div class="card"><strong>Produs analizat: '+esc(selected.name)+'</strong><div class="muted">'+esc(selected.region)+' · '+esc(sourceName(selected))+'</div></div>'+chips(['Viralitate','Concurență','Profit','Furnizori'],tab,'setTab');if(tab==='Profit')return profitView();if(tab==='Furnizori')return suppliersView();if(tab==='Concurență')return competitionView();h='<div class="card"><strong>Produs analizat: '+esc(selected.name)+'</strong></div><div class="card"><div class="flex"><h3>Interes în timp</h3><span class="badge">'+esc(period)+'</span></div>'+chart()+'</div><div class="card"><h3>Surse de trafic</h3><div class="empty">Distribuția TikTok, YouTube și Instagram nu este disponibilă din fluxul actual</div></div><div class="card"><h3>Informații verificate</h3><div class="row"><span class="muted">Subiect</span><strong>'+esc(selected.name)+'</strong></div><div class="row"><span class="muted">Țară</span><strong>'+esc(selected.region)+'</strong></div><div class="row"><span class="muted">Volum raportat</span><strong class="accent">'+label(selected)+'</strong></div></div><button class="btn" onclick="go(\'Furnizori\')">Vezi furnizori →</button>'}if(page==='Furnizori')h=suppliersView();if(page==='Profit')h=profitView();if(page==='Concurență')h=competitionView();if(page==='AI')h='<div class="card"><h3>Analiză AI</h3><p class="muted">Verdictul automat necesită date despre produs, cerere, concurență și costuri. Nu atribuim calificative fără dovezi</p></div>'+sourceLinks(selected);if(page==='Salvate')h=chips(['Watchlist','Alerte','Compară'],'Watchlist','noop')+(saved.length?rows(saved,'saved'):'<div class="card empty">Nu ai produse salvate</div>');if(page==='Profil')h='<div class="card"><h3>Profil ViralRadar</h3><div class="stats"><div class="stat"><small>Salvate</small><strong>'+saved.length+'</strong></div><div class="stat"><small>Oferte</small><strong>'+offers.length+'</strong></div></div><p class="footnote">Datele salvate sunt locale în browser. Nu există încă autentificare sau sincronizare între dispozitive</p></div><div class="card"><h3>Surse de date</h3><p class="muted">Google Trends RSS prin actualizări automate GitHub Actions</p><p class="muted">Ultima actualizare '+esc(pdate())+'</p></div>';return h}function noop(){}function suppliersView(){if(!selected)return '<div class="card empty">Alege mai întâi un rezultat din Descoperă</div>';let a=[...(liveOffers[id(selected)]||[]).map(o=>({...o,key:id(selected),automated:true})),...offers.filter(o=>o.key===id(selected))];if(offerFilter!=='Toate')a=a.filter(o=>o.

<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071720"><title>ViralRadar</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% -10%,#183b40 0%,#071720 53%);color:#eff8f5;font:15px system-ui}header{height:64px;background:#0b2029;border-bottom:1px solid #23414a;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:fixed;top:0;left:0;right:0;z-index:2}b.logo{color:#c0f66a;font-size:22px}#sub{position:fixed;top:64px;height:52px;background:#0b2029;left:0;right:0;border-bottom:1px solid #23414a;display:flex;align-items:center;gap:18px;padding:0 18px;z-index:2}#back{border:0;background:none;color:#c0f66a;font-size:26px;cursor:pointer}main{position:fixed;top:116px;bottom:78px;overflow:auto;width:100%;padding:18px;max-width:700px;left:50%;transform:translateX(-50%)}nav{position:fixed;bottom:0;left:0;right:0;background:#0b2029;border-top:1px solid #23414a;display:flex;justify-content:space-around;padding:12px 4px max(12px,env(safe-area-inset-bottom));z-index:2}button{cursor:pointer}nav button{border:0;background:none;color:#a7bac0;font-size:12px;padding:6px}nav button.active{color:#c0f66a}.card{background:linear-gradient(145deg,#173740,#102730);border:1px solid #31505a;border-radius:21px;padding:19px;box-shadow:0 8px 30px #0002;margin:0 0 14px}.muted{color:#a5b9bd;font-size:13px}.pill{border:1px solid #3b5c63;border-radius:22px;background:#19353e;color:white;padding:10px 13px;margin:4px 4px 7px 0}.pill.sel,.primary{background:#c0f66a;color:#0b1c23;border-color:#c0f66a;font-weight:700}.primary{padding:13px 18px;border:0;border-radius:12px;width:100%;margin-top:10px}.line{display:flex;justify-content:space-between;align-items:center;gap:12px}.green{color:#c0f66a}.metric{font-size:30px;font-weight:800}.input{background:#081c25;border:1px solid #37535b;color:white;border-radius:10px;padding:12px;width:100%;margin:6px 0 13px}label{display:block;color:#b4c6ca;font-size:13px}h3{margin:0 0 12px;font-size:17px}small{color:#a5b9bd}.empty{padding:22px;text-align:center;color:#b3c5c8}.tag{color:#c0f66a;font-size:12px}a{color:#c0f66a} .hero{padding:23px;background:linear-gradient(125deg,#24473c,#12313a 62%,#10262f);border:1px solid #54755c;border-radius:23px;margin-bottom:16px}.hero h2{font-size:26px;line-height:1.12;margin:7px 0 9px}.hero p{font-size:13px;color:#c1d4d2}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px}.stat{background:#112c35;border:1px solid #31505a;border-radius:18px;padding:16px}.stat strong{display:block;font-size:25px;color:#c0f66a}.section{font-size:16px;font-weight:750;margin:20px 0 12px}.steps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.step{background:#132e37;border:1px solid #31505a;border-radius:18px;padding:18px;cursor:pointer}.step .symbol{font-size:27px;color:#c0f66a}.step strong{display:block;margin:10px 0 5px}.step small{line-height:1.5}.mini{display:inline-block;color:#c0f66a;font-size:11px;font-weight:750;letter-spacing:.09em}.product-row{display:flex;align-items:center;gap:14px}.product-thumb{width:62px;height:62px;flex-shrink:0;border-radius:14px;background:linear-gradient(135deg,#38534e,#172f3d);display:grid;place-items:center;font-size:27px}.product-text{flex:1;min-width:0}.product-text strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}button:focus-visible{outline:2px solid #c0f66a;outline-offset:2px} </style></head><body><header><b class="logo">◉ ViralRadar</b><span>♧</span></header><div id="sub"><button id="back" onclick="back()">‹</button><strong id="title">Acasă</strong></div><main id="main"></main><nav id="nav"></nav><script>
const tabs=['Acasă','Trenduri','Analiză','Salvate','Profil'];const icons=['⌂','⌕','▥','♡','♙'];let page='Acasă',history=[],region='Italia',period='7 zile',products=JSON.parse(localStorage.getItem('vr-products')||'[]'),selected=null,offers=JSON.parse(localStorage.getItem('vr-offers')||'[]'),drafts=JSON.parse(localStorage.getItem('vr-drafts')||'[]');function save(){localStorage.setItem('vr-products',JSON.stringify(products));localStorage.setItem('vr-offers',JSON.stringify(offers));localStorage.setItem('vr-drafts',JSON.stringify(drafts))}function go(p){history.push(page);page=p;render()}function back(){page=history.pop()||'Acasă';render()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function btn(t,p){return '<button class="primary" onclick="go(\''+p+'\')">'+t+'</button>'}function choose(i){selected=i;go('Produs')}function addProduct(){let name=document.getElementById('pn').value.trim(),category=document.getElementById('pc').value.trim();if(!name)return alert('Introdu numele produsului');products.unshift({name,category});save();go('Salvate')}function addOffer(){let seller=document.getElementById('seller').value.trim(),url=document.getElementById('url').value.trim(),price=Number(document.getElementById('price').value),shipping=Number(document.getElementById('shipping').value);if(!seller||!/^https:\/\//.test(url)||price<=0)return alert('Completează vânzătorul, prețul și un URL HTTPS valid');offers.push({product:selected,seller,url,price,shipping});save();render()}function addDraft(){let price=Number(document.getElementById('sell').value);if(price<=0)return alert('Introdu prețul');drafts.push({product:selected,price,status:'Draft'});save();go('Shop Studio')}function viewProduct(i){selected=i;go('Produs')}function render(){document.getElementById('title').textContent=page;document.getElementById('back').style.visibility=tabs.includes(page)?'hidden':'visible';document.getElementById('nav').innerHTML=tabs.map((t,i)=>'<button class="'+(t===page?'active':'')+'" onclick="go(\''+t+'\')"><div style="font-size:23px">'+icons[i]+'</div>'+t+'</button>').join('');let h='';if(page==='Acasă')h='<div class="hero"><span class="mini">◉ VIRALRADAR STUDIO</span><h2>Descoperă. Analizează.<br><span class="green">Vinde inteligent.</span></h2><p>Panoul tău de cercetare și pregătire a produselor pentru magazin.</p>'+btn('⌕ Explorează tendințele','Trenduri')+'</div><div class="stats"><div class="stat"><small>PRODUSE SALVATE</small><strong>'+products.length+'</strong><small>În lista de cercetare</small></div><div class="stat"><small>OFERTE COMPARATE</small><strong>'+offers.length+'</strong><small>Adăugate manual</small></div><div class="stat"><small>DRAFTURI SHOP</small><strong>'+drafts.length+'</strong><small>În pregătire</small></div><div class="stat"><small>PIEȚE</small><strong>Global</strong><small>Filtrare pe țări</small></div></div><div class="section">Instrumentele tale</div><div class="steps"><div class="step" onclick="go(\'Trenduri\')"><div class="symbol">◉</div><strong>Trenduri</strong><small>Explorează piețele și perioadele</small></div><div class="step" onclick="go(\'Salvate\')"><div class="symbol">♡</div><strong>Watchlist</strong><small>Produsele urmărite de tine</small></div><div class="step" onclick="go(\'Analiză\')"><div class="symbol">▥</div><strong>Analiză</strong><small>Costuri și comparații</small></div><div class="step" onclick="go(\'Shop Studio\')"><div class="symbol">▣</div><strong>Shop Studio</strong><small>Pagini de produs în draft</small></div></div><div class="section">Produse recente</div>'+(products.length?products.slice(0,4).map((p,i)=>'<div class="card product-row" onclick="viewProduct('+i+')"><div class="product-thumb">◈</div><div class="product-text"><strong>'+esc(p.name)+'</strong><small>'+esc(p.category||'Produs salvat')+'</small></div><span class="green">›</span></div>').join(''):'<div class="card empty">Nu ai încă produse. Adaugă primul produs pentru cercetare.'+btn('＋ Adaugă produs','Adaugă produs')+'</div>');if(page==='Trenduri')h='<div class="card"><h3>Regiune</h3>'+['Italia','Europa','Global','Franța','Germania','Spania','România','Regatul Unit','SUA','Canada','Polonia'].map(r=>'<button class="pill '+(region===r?'sel':'')+'" onclick="region=\''+r+'\';render()">'+r+'</button>').join('')+'<h3>Perioadă</h3>'+['24h','7 zile','30 zile','90 zile'].map(p=>'<button class="pill '+(period===p?'sel':'')+'" onclick="period=\''+p+'\';render()">'+p+'</button>').join('')+'</div><div class="card"><h3>Trenduri · '+region+'</h3><div class="empty">Nu sunt conectate încă surse de trenduri verificate. Nu afișăm scoruri inventate.</div>'+btn('Adaugă un produs de cercetat','Adaugă produs')+'</div>';if(page==='Adaugă produs')h='<div class="card"><label>Produs</label><input class="input" id="pn" placeholder="Numele exact al produsului"><label>Categorie</label><input class="input" id="pc" placeholder="Ex. Electronice"><button class="primary" onclick="addProduct()">Salvează produsul</button></div>';if(page==='Salvate')h=products.length?products.map((p,i)=>'<div class="card"><div class="line"><strong>'+esc(p.name)+'</strong><span class="tag">Salvat</span></div><p class="muted">'+esc(p.category||'Fără categorie')+'</p><button class="primary" onclick="viewProduct('+i+')">Deschide produsul</button></div>').join(''):'<div class="card empty">Nu ai produse salvate.'+btn('Adaugă produs','Adaugă produs')+'</div>';if(page==='Produs'){let p=products[selected];h=p?'<div class="card"><h3>'+esc(p.name)+'</h3><div class="muted">'+esc(p.category)+'</div><p class="muted">Datele de viralitate și ofertele necesită verificare.</p>'+btn('Compară furnizori','Furnizori')+btn('Calculează profit','Profit')+btn('Pregătește pagina de vânzare','Draft nou')+'</div>':''}if(page==='Furnizori'){let list=offers.filter(o=>o.product===selected).sort((a,b)=>(a.price+a.shipping)-(b.price+b.shipping));h='<div class="card"><h3>Oferte introduse și verificate manual</h3>'+list.map(o=>'<div class="card"><strong>'+esc(o.seller)+'</strong><p class="green">'+(o.price+o.shipping).toFixed(2)+' € total</p><a target="_blank" rel="noopener noreferrer" href="'+esc(o.url)+'">Vezi oferta ↗</a></div>').join('')+'<label>Vânzător</label><input class="input" id="seller"><label>Link exact HTTPS</label><input class="input" id="url"><label>Preț (€)</label><input class="input" id="price" type="number" min="0" step=".01"><label>Livrare (€)</label><input class="input" id="shipping" type="number" min="0" step=".01" value="0"><button class="primary" onclick="addOffer()">Adaugă oferta</button></div>'}if(page==='Profit')h='<div class="card"><h3>Calculator</h3>'+['Preț vânzare','Cost produs','Livrare','Comision plată','Publicitate'].map((s,i)=>'<label>'+s+' (€)</label><input class="input calc" type="number" min="0" step=".01" value="0" oninput="calc()"/>').join('')+'<hr><div class="line"><strong>Contribuție estimată</strong><strong class="metric green" id="margin">0,00 €</strong></div><p class="muted">Înainte de TVA, taxe, retururi și alte costuri.</p></div>';if(page==='Draft nou')h='<div class="card"><h3>'+esc(products[selected]?.name||'Produs')+'</h3><label>Preț propus (€)</label><input id="sell" type="number" min="0" step=".01" class="input"><button class="primary" onclick="addDraft()">Salvează draftul</button></div>';if(page==='Shop Studio')h='<div class="card"><h3>Magazin public</h3><p class="muted">Drafturile de pe acest telefon nu sunt publicate automat. Publicarea necesită verificarea produsului și actualizarea catalogului public.</p><a href="./shop.html" target="_blank" rel="noopener noreferrer">Vezi magazinul ↗</a></div>'+ (drafts.map(d=>'<div class="card"><span class="tag">'+esc(d.status)+'</span><h3>'+esc(products[d.product]?.name||'Produs')+'</h3><p>'+d.price.toFixed(2)+' €</p><p class="muted">Draft local; nu este publicat în magazin.</p></div>').join('')||'<div class="card empty">Nu există drafturi.</div>');if(page==='Analiză')h='<div class="card"><h3>Analiză produse</h3><p class="muted">Selectează un produs salvat pentru analiza costurilor și ofertelor.</p>'+btn('Produse salvate','Salvate')+'</div><div class="card"><h3>Shop Studio</h3>'+btn('Vezi drafturile','Shop Studio')+'</div>';if(page==='Profil')h='<div class="card"><h3>ViralRadar · Demo</h3><p class="muted">Datele se salvează numai în acest browser. Nu există încă autentificare sau sincronizare.</p><p>Produse: '+products.length+' · Oferte: '+offers.length+' · Drafturi: '+drafts.length+'</p></div>';document.getElementById('main').innerHTML=h;if(page==='Profit')calc()}function calc(){let v=[...document.querySelectorAll('.calc')].map(x=>Number(x.value)||0);document.getElementById('margin').textContent=(v[0]-v.slice(1).reduce((a,b)=>a+b,0)).toFixed(2).replace('.',',')+' €'}render();</script></body></html>

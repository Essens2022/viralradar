<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071720"><title>ViralRadar</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% -10%,#183b40 0%,#071720 53%);color:#eff8f5;font:15px system-ui}header{height:64px;background:#0b2029;border-bottom:1px solid #23414a;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:fixed;top:0;left:0;right:0;z-index:2}b.logo{color:#c0f66a;font-size:22px}#sub{position:fixed;top:64px;height:52px;background:#0b2029;left:0;right:0;border-bottom:1px solid #23414a;display:flex;align-items:center;gap:18px;padding:0 18px;z-index:2}#back{border:0;background:none;color:#c0f66a;font-size:26px;cursor:pointer}main{position:fixed;top:116px;bottom:78px;overflow:auto;width:100%;padding:18px;max-width:700px;left:50%;transform:translateX(-50%)}nav{position:fixed;bottom:0;left:0;right:0;background:#0b2029;border-top:1px solid #23414a;display:flex;justify-content:space-around;padding:12px 4px max(12px,env(safe-area-inset-bottom));z-index:2}button{cursor:pointer}nav button{border:0;background:none;color:#a7bac0;font-size:12px;padding:6px}nav button.active{color:#c0f66a}.card{background:linear-gradient(145deg,#173740,#102730);border:1px solid #31505a;border-radius:21px;padding:19px;box-shadow:0 8px 30px #0002;margin:0 0 14px}.muted{color:#a5b9bd;font-size:13px}.pill{border:1px solid #3b5c63;border-radius:22px;background:#19353e;color:white;padding:10px 13px;margin:4px 4px 7px 0}.pill.sel,.primary{background:#c0f66a;color:#0b1c23;border-color:#c0f66a;font-weight:700}.primary{padding:13px 18px;border:0;border-radius:12px;width:100%;margin-top:10px}.line{display:flex;justify-content:space-between;align-items:center;gap:12px}.green{color:#c0f66a}.metric{font-size:30px;font-weight:800}.input{background:#081c25;border:1px solid #37535b;color:white;border-radius:10px;padding:12px;width:100%;margin:6px 0 13px}label{display:block;color:#b4c6ca;font-size:13px}h3{margin:0 0 12px;font-size:17px}small{color:#a5b9bd}.empty{padding:22px;text-align:center;color:#b3c5c8}.tag{color:#c0f66a;font-size:12px}a{color:#c0f66a} .hero{padding:23px;background:linear-gradient(125deg,#24473c,#12313a 62%,#10262f);border:1px solid #54755c;border-radius:23px;margin-bottom:16px}.hero h2{font-size:26px;line-height:1.12;margin:7px 0 9px}.hero p{font-size:13px;color:#c1d4d2}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px}.stat{background:#112c35;border:1px solid #31505a;border-radius:18px;padding:16px}.stat strong{display:block;font-size:25px;color:#c0f66a}.section{font-size:16px;font-weight:750;margin:20px 0 12px}.steps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.step{background:#132e37;border:1px solid #31505a;border-radius:18px;padding:18px;cursor:pointer}.step .symbol{font-size:27px;color:#c0f66a}.step strong{display:block;margin:10px 0 5px}.step small{line-height:1.5}.mini{display:inline-block;color:#c0f66a;font-size:11px;font-weight:750;letter-spacing:.09em}.product-row{display:flex;align-items:center;gap:14px}.product-thumb{width:62px;height:62px;flex-shrink:0;border-radius:14px;background:linear-gradient(135deg,#38534e,#172f3d);display:grid;place-items:center;font-size:27px}.product-text{flex:1;min-width:0}.product-text strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}button:focus-visible{outline:2px solid #c0f66a;outline-offset:2px}  .radar{background:radial-gradient(circle at 50% 50%,#234f47,#102d35 65%);border:1px solid #416f60;border-radius:23px;text-align:center;padding:26px 16px;margin-bottom:15px}.radar-ring{width:128px;height:128px;margin:0 auto 16px;border:1px solid #82b663;border-radius:50%;position:relative;background:repeating-radial-gradient(circle,transparent 0 24px,#3a6e5a88 25px 26px);display:grid;place-items:center}.radar-ring:after{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 65%,#c0f66a55 90%,transparent);animation:sweep 4s linear infinite}.radar-ring span{font-size:38px;color:#c0f66a;z-index:1}@keyframes sweep{to{transform:rotate(360deg)}}.trend-card{display:flex;align-items:center;gap:13px;padding:15px;background:#132f38;border:1px solid #2b5058;border-radius:17px;margin:0 0 9px;cursor:pointer}.trend-rank{font-size:21px;font-weight:800;color:#c0f66a;width:28px}.trend-body{flex:1;min-width:0}.trend-body strong{display:block;font-size:15px}.trend-body small{display:block;margin-top:4px}.notice{font-size:12px;color:#9eb8b6;line-height:1.5;margin:12px 0}.radar-loading{opacity:.7}.live-pill{font-size:11px;border:1px solid #406b54;border-radius:20px;padding:6px 10px;color:#c0f66a}.radar-filters{display:flex;overflow:auto;white-space:nowrap;padding-bottom:6px}.radar-filters .pill{flex-shrink:0} </style></head><body><header><b class="logo">◉ ViralRadar</b><span>♧</span></header><div id="sub"><button id="back" onclick="back()">‹</button><strong id="title">Acasă</strong></div><main id="main"></main><nav id="nav"></nav><script>
const tabs=['Acasă','Trenduri','Analiză','Salvate','Profil'];const icons=['⌂','⌕','▥','♡','♙'];let liveTrends=[],liveUpdated='',liveError='',radarBusy=false;let page='Acasă',history=[],region='Italia',period='7 zile',products=JSON.parse(localStorage.getItem('vr-products')||'[]'),selected=null,offers=JSON.parse(localStorage.getItem('vr-offers')||'[]'),drafts=JSON.parse(localStorage.getItem('vr-drafts')||'[]');function save(){localStorage.setItem('vr-products',JSON.stringify(products));localStorage.setItem('vr-offers',JSON.stringify(offers));localStorage.setItem('vr-drafts',JSON.stringify(drafts))}function go(p){history.push(page);page=p;render()}function back(){page=history.pop()||'Acasă';render()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function btn(t,p){return '<button class="primary" onclick="go(\''+p+'\')">'+t+'</button>'}function choose(i){selected=i;go('Produs')}function searchWeb(kind){let q=(document.getElementById('searchq')?.value||products[selected]?.name||'').trim();if(!q)return alert('Introdu un produs');let links={google:'https://www.google.com/search?q=',trends:'https://trends.google.com/trends/explore?date=today%203-m&q=',shopping:'https://www.google.com/search?tbm=shop&q=',amazon:'https://www.amazon.it/s?k=',ebay:'https://www.ebay.it/sch/i.html?_nkw=',aliexpress:'https://www.aliexpress.com/w/wholesale-',tiktok:'https://www.tiktok.com/search?q='};let url=links[kind]+encodeURIComponent(q)+(kind==='aliexpress'?'.html':'');window.open(url,'_blank','noopener,noreferrer')}function searchActions(){return '<div class="card"><h3>Cercetare verificabilă</h3><p class="muted">Căutările deschid sursele originale. Nu sunt rezultate extrase automat și nu reprezintă date în timp real în ViralRadar.</p><div class="steps">'+[['trends','Google Trends'],['shopping','Google Shopping'],['tiktok','TikTok'],['google','Căutare web'],['amazon','Amazon Italia'],['ebay','eBay'],['aliexpress','AliExpress']].map(a=>'<button class="pill" onclick="searchWeb(\''+a[0]+'\')">↗ '+a[1]+'</button>').join('')+'</div></div>'}async function scanRadar(){radarBusy=true;liveError='';render();try{let response=await fetch('./trends.json?ts='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('Datele nu sunt încă disponibile');let data=await response.json();liveTrends=Array.isArray(data.items)?data.items:[];liveUpdated=data.updatedAt||'';if(!liveTrends.length)throw Error('Nu au fost primite tendințe');}catch(e){liveError=e.message||'Nu am putut încărca tendințele';}radarBusy=false;render()}function chooseTrend(i){let t=liveTrends.filter(x=>region==='Global'||region==='Europa'||x.region===region)[i];if(!t)return;let idx=products.findIndex(p=>p.name===t.name);if(idx<0){products.unshift({name:t.name,category:'Subiect în tendințe',source:t.source,region:t.region,traffic:t.traffic,sourceUrl:t.url});save();idx=0;}selected=idx;go('Produs')}function addProduct(){let name=document.getElementById('pn').value.trim(),category=document.getElementById('pc').value.trim();if(!name)return alert('Introdu numele produsului');products.unshift({name,category});save();go('Salvate')}function addOffer(){let seller=document.getElementById('seller').value.trim(),url=document.getElementById('url').value.trim(),price=Number(document.getElementById('price').value),shipping=Number(document.getElementById('shipping').value);if(!seller||!/^https:\/\//.test(url)||price<=0)return alert('Completează vânzătorul, prețul și un URL HTTPS valid');offers.push({product:selected,seller,url,price,shipping});save();render()}function addDraft(){let price=Number(document.getElementById('sell').value);if(price<=0)return alert('Introdu prețul');drafts.push({product:selected,price,status:'Draft'});save();go('Shop Studio')}function viewProduct(i){selected=i;go('Produs')}function render(){document.getElementById('title').textContent=page;document.getElementById('back').style.visibility=tabs.includes(page)?'hidden':'visible';document.getElementById('nav').innerHTML=tabs.map((t,i)=>'<button class="'+(t===page?'active':'')+'" onclick="go(\''+t+'\')"><div style="font-size:23px">'+icons[i]+'</div>'+t+'</button>').join('');let h='';if(page==='Acasă')h='<div class="hero"><span class="mini">◉ VIRALRADAR STUDIO</span><h2>Descoperă. Analizează.<br><span class="green">Vinde inteligent.</span></h2><p>Panoul tău de cercetare și pregătire a produselor pentru magazin.</p>'+btn('⌕ Explorează tendințele','Trenduri')+'</div><div class="stats"><div class="stat"><small>PRODUSE SALVATE</small><strong>'+products.length+'</strong><small>În lista de cercetare</small></div><div class="stat"><small>OFERTE COMPARATE</small><strong>'+offers.length+'</strong><small>Adăugate manual</small></div><div class="stat"><small>PRODUSE ANALIZATE</small><strong>'+products.length+'</strong><small>În watchlist</small></div><div class="stat"><small>PIEȚE</small><strong>Global</strong><small>Filtrare pe țări</small></div></div><div class="section">Instrumentele tale</div><div class="steps"><div class="step" onclick="go(\'Trenduri\')"><div class="symbol">◉</div><strong>Trenduri</strong><small>Explorează piețele și perioadele</small></div><div class="step" onclick="go(\'Salvate\')"><div class="symbol">♡</div><strong>Watchlist</strong><small>Produsele urmărite de tine</small></div><div class="step" onclick="go(\'Analiză\')"><div class="symbol">▥</div><strong>Analiză</strong><small>Costuri și comparații</small></div><div class="step" onclick="go(\'Shop Studio\')"><div class="symbol">▣</div><strong>Shop Studio</strong><small>Pagini de produs în draft</small></div></div><div class="section">Produse recente</div>'+(products.length?products.slice(0,4).map((p,i)=>'<div class="card product-row" onclick="viewProduct('+i+')"><div class="product-thumb">◈</div><div class="product-text"><strong>'+esc(p.name)+'</strong><small>'+esc(p.category||'Produs salvat')+'</small></div><span class="green">›</span></div>').join(''):'<div class="card empty">Nu ai încă produse. Adaugă primul produs pentru cercetare.'+btn('＋ Adaugă produs','Adaugă produs')+'</div>');if(page==='Trenduri'){let visible=liveTrends.filter(x=>region==='Global'||region==='Europa'||x.region===region);h='<div class="radar"><div class="radar-ring"><span>⌖</span></div><h3>Radar tendințe</h3><p class="muted">Descoperire automată din fluxuri publice de căutări</p><button class="primary" onclick="scanRadar()" '+(radarBusy?'disabled':'')+'>'+(radarBusy?'Se caută tendințele…':'⌕ Scanează acum')+'</button></div><div class="radar-filters">'+['Italia','Europa','Global','Franța','Germania','Spania','România','Regatul Unit','SUA','Canada','Polonia'].map(r=>'<button class="pill '+(region===r?'sel':'')+'" onclick="region=\''+r+'\';render()">'+r+'</button>').join('')+'</div><div class="radar-filters">'+['24h','7 zile','30 zile','90 zile'].map(p=>'<button class="pill '+(period===p?'sel':'')+'" onclick="period=\''+p+'\';render()">'+p+'</button>').join('')+'</div><div class="line"><h3>Rezultatele radarului</h3><span class="live-pill">'+(liveUpdated?'Sursă actualizată':'Sursă externă')+'</span></div><p class="notice">Sursa Google Trends RSS arată subiecte căutate, nu confirmă că sunt produse virale sau că se vând. Fluxul disponibil este zilnic; opțiunile 7, 30 și 90 de zile nu au încă date istorice distincte.</p>'+(liveError?'<div class="card">'+esc(liveError)+'</div>':'')+(visible.length?visible.slice(0,50).map((t,i)=>'<div class="trend-card" onclick="chooseTrend('+i+')"><span class="trend-rank">'+(i+1)+'</span><div class="trend-body"><strong>'+esc(t.name)+'</strong><small>'+esc(t.region)+' · '+esc(t.traffic||'Volum indisponibil')+' · '+esc(t.source)+'</small></div><span class="green">›</span></div>').join(''):'<div class="card empty">Apasă Scanează acum pentru a încărca tendințele disponibile. Dacă fluxul nu este încă generat, radarul va indica acest lucru.</div>')};if(page==='Adaugă produs')h='<div class="card"><label>Produs</label><input class="input" id="pn" placeholder="Numele exact al produsului"><label>Categorie</label><input class="input" id="pc" placeholder="Ex. Electronice"><button class="primary" onclick="addProduct()">Salvează produsul</button></div>';if(page==='Salvate')h=products.length?products.map((p,i)=>'<div class="card"><div class="line"><strong>'+esc(p.name)+'</strong><span class="tag">Salvat</span></div><p class="muted">'+esc(p.category||'Fără categorie')+'</p><button class="primary" onclick="viewProduct('+i+')">Deschide produsul</button></div>').join(''):'<div class="card empty">Nu ai produse salvate.'+btn('Adaugă produs','Adaugă produs')+'</div>';if(page==='Produs'){let p=products[selected];h=p?'<div class="card"><span class="live-pill">'+esc(p.source||'Produs salvat')+'</span><h3 style="margin-top:14px;font-size:23px">'+esc(p.name)+'</h3><div class="muted">'+esc(p.region||p.category||'')+'</div><div class="stats" style="margin-top:16px"><div class="stat"><small>INTERES RAPORTAT</small><strong style="font-size:18px">'+esc(p.traffic||'—')+'</strong></div><div class="stat"><small>SCOR VIRALITATE</small><strong style="font-size:18px">N/D</strong></div></div><p class="notice">Datele de interes sunt din căutări, nu din vânzări. Scorul nu este calculat fără surse suficiente.</p>'+(p.sourceUrl?'<a target="_blank" rel="noopener noreferrer" href="'+esc(p.sourceUrl)+'">Vezi sursa originală ↗</a>':'')+'</div>'+searchActions()+btn('Compară furnizori','Furnizori')+btn('Calculează profit','Profit'):''}if(page==='Furnizori'){let list=offers.filter(o=>o.product===selected).sort((a,b)=>(a.price+a.shipping)-(b.price+b.shipping));h=searchActions()+'<div class="card"><h3>Oferte introduse manual (neverificate automat)</h3>'+list.map(o=>'<div class="card"><strong>'+esc(o.seller)+'</strong><p class="green">'+(o.price+o.shipping).toFixed(2)+' € total</p><a target="_blank" rel="noopener noreferrer" href="'+esc(o.url)+'">Vezi oferta ↗</a></div>').join('')+'<label>Vânzător</label><input class="input" id="seller"><label>Link exact HTTPS</label><input class="input" id="url"><label>Preț (€)</label><input class="input" id="price" type="number" min="0" step=".01"><label>Livrare (€)</label><input class="input" id="shipping" type="number" min="0" step=".01" value="0"><button class="primary" onclick="addOffer()">Adaugă oferta</button></div>'}if(page==='Profit')h='<div class="card"><h3>Calculator</h3>'+['Preț vânzare','Cost produs','Livrare','Comision plată','Publicitate'].map((s,i)=>'<label>'+s+' (€)</label><input class="input calc" type="number" min="0" step=".01" value="0" oninput="calc()"/>').join('')+'<hr><div class="line"><strong>Contribuție estimată</strong><strong class="metric green" id="margin">0,00 €</strong></div><p class="muted">Înainte de TVA, taxe, retururi și alte costuri.</p></div>';if(page==='Draft nou')h='<div class="card"><h3>'+esc(products[selected]?.name||'Produs')+'</h3><label>Preț propus (€)</label><input id="sell" type="number" min="0" step=".01" class="input"><button class="primary" onclick="addDraft()">Salvează draftul</button></div>';if(page==='Shop Studio')h='<div class="card"><h3>Magazin public</h3><p class="muted">Drafturile de pe acest telefon nu sunt publicate automat. Publicarea necesită verificarea produsului și actualizarea catalogului public.</p><a href="./shop.html" target="_blank" rel="noopener noreferrer">Vezi magazinul ↗</a></div>'+ (drafts.map(d=>'<div class="card"><span class="tag">'+esc(d.status)+'</span><h3>'+esc(products[d.product]?.name||'Produs')+'</h3><p>'+d.price.toFixed(2)+' €</p><p class="muted">Draft local; nu este publicat în magazin.</p></div>').join('')||'<div class="card empty">Nu există drafturi.</div>');if(page==='Analiză')h='<div class="card"><h3>Analiză produse</h3><p class="muted">Selectează un produs salvat pentru analiza costurilor și ofertelor.</p>'+btn('Produse salvate','Salvate')+'</div><div class="card"><h3>Shop Studio</h3>'+btn('Vezi drafturile','Shop Studio')+'</div>';if(page==='Profil')h='<div class="card"><h3>ViralRadar · Demo</h3><p class="muted">Datele se salvează numai în acest browser. Nu există încă autentificare sau sincronizare.</p><p>Produse: '+products.length+' · Oferte: '+offers.length+' · Drafturi: '+drafts.length+'</p></div>';document.getElementById('main').innerHTML=h;if(page==='Profit')calc()}function calc(){let v=[...document.querySelectorAll('.calc')].map(x=>Number(x.value)||0);document.getElementById('margin').textContent=(v[0]-v.slice(1).reduce((a,b)=>a+b,0)).toFixed(2).replace('.',',')+' €'}render();</script></body></html>

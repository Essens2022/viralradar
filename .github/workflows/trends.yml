name: Refresh live trends
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fetch_trends.py
      - name: Commit verified feed
        run: |
          git config user.name "viralradar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trends.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh live Google Trends feed"
            git push
          fi
